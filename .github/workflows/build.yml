


name: Build StrengthSMP

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract ZIP
        run: |
          ZIP="StrengthSMP-GitHub-Build.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP=$(find . -maxdepth 1 -type f -iname 'StrengthSMP*.zip' -print -quit)
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP sumber tidak ditemukan!"
            echo "Daftar file ZIP:"
            find . -type f -iname '*.zip'
            exit 1
          fi

          echo "Menggunakan ZIP: $ZIP"
          mkdir -p source
          unzip -o "$ZIP" -d source

      - name: Find Maven project
        run: |
          POM=$(find source -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan di dalam ZIP!"
            find source -maxdepth 4 -type f
            exit 1
          fi
          echo "POM ditemukan: $POM"
          echo "$POM" > pom_path.txt

      - name: Build plugin
        run: |
          POM=$(cat pom_path.txt)
          cd "$(dirname "$POM")"
          mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: StrengthSMP-JAR
          path: source/**/target/*.jar
          if-no-files-found: error
