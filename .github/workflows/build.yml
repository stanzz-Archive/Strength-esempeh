

name: Build StrengthSMP

on:
  workflow_dispatch:
  push:
    paths:
      - 'StrengthSMP-GitHub-Build.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java
        run: java -version

      - name: Extract ZIP
        run: |
          unzip -o StrengthSMP-GitHub-Build.zip -d source

      - name: Build plugin
        run: |
          POM=$(find source -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan"
            exit 1
          fi
          cd "$(dirname "$POM")"
          mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: StrengthSMP-JAR
          path: source/**/target/*.jar
          if-no-files-found: error
